{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-900">How Did We Do?</h1>
        <p class="text-gray-600 mt-2">Ticket <strong class="font-mono">{{ ticket.ticket_number }}</strong> was closed. Your feedback helps us improve.</p>
    </div>

    <form class="bg-white p-6 rounded-lg shadow space-y-6" hx-post="/feedback/{{ ticket.ticket_number }}" hx-target="body" hx-swap="innerHTML">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Was your issue resolved?</label>
            <div class="space-y-2">
                <label class="flex items-center gap-3 p-3 border rounded hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="resolved" value="Yes, completely" required class="text-blue-600">
                    <span class="text-gray-700">Yes, completely</span>
                </label>
                <label class="flex items-center gap-3 p-3 border rounded hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="resolved" value="Partially" class="text-blue-600">
                    <span class="text-gray-700">Partially</span>
                </label>
                <label class="flex items-center gap-3 p-3 border rounded hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="resolved" value="No" class="text-blue-600">
                    <span class="text-gray-700">No</span>
                </label>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">How was the response time?</label>
            <div class="space-y-2">
                <label class="flex items-center gap-3 p-3 border rounded hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="response_time" value="Fast" required class="text-blue-600">
                    <span class="text-gray-700">Fast</span>
                </label>
                <label class="flex items-center gap-3 p-3 border rounded hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="response_time" value="Okay" class="text-blue-600">
                    <span class="text-gray-700">Okay</span>
                </label>
                <label class="flex items-center gap-3 p-3 border rounded hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="response_time" value="Slow" class="text-blue-600">
                    <span class="text-gray-700">Slow</span>
                </label>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Any comment?</label>
            <textarea name="comment" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Optional..."></textarea>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 transition font-medium">
            Submit Feedback
        </button>
    </form>
</div>
{% endblock %}
