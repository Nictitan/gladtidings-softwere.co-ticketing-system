{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Tell Us How We're Doing</h1>
        <p class="text-gray-600 mt-2">Your feedback helps us improve Zamed, Coinfomas, ZamPrep, and our services.</p>
    </div>

    <form class="bg-white p-6 rounded-lg shadow space-y-6" hx-post="/public" hx-target="body" hx-swap="innerHTML">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Your Name <span class="text-red-500">*</span></label>
            <input type="text" name="reporter_name" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="John Doe">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">School / Institution</label>
            <input type="text" name="school_institution" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Springfield Primary">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contact (phone or email)</label>
            <input type="text" name="contact" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="+260 97 123 4567 or john@school.edu">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Product / Service <span class="text-red-500">*</span></label>
            <select name="product" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                {% for p in products %}
                <option value="{{ p.value }}">{{ p.value }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">What's Working Well?</label>
            <textarea name="working_well" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tell us what you like..."></textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">What Isn't Working? <span class="text-red-500">*</span></label>
            <textarea name="not_working" required rows="4" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Describe the problem..."></textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Priority <span class="text-red-500">*</span></label>
            <select name="priority" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                {% for p in priorities %}
                <option value="{{ p.value }}">{{ p.value }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 transition font-medium text-lg">
            Submit Review
        </button>
    </form>

    <div class="text-center mt-6 text-sm text-gray-500">
        <p>This creates a ticket in our help desk. We'll follow up if needed.</p>
    </div>
</div>
{% endblock %}
